name: Just Added regression and read-only manifest audit

on:
  push:
    branches: [dobins-catalog]
    paths:
      - 'dobins-indian-catalog/update.py'
      - 'dobins-indian-catalog/tests/**'
      - 'dobins-indian-catalog/audit_just_added.mjs'
      - '.github/workflows/just-added-regression-audit.yml'
  pull_request:
    branches: [dobins-catalog]
    paths:
      - 'dobins-indian-catalog/update.py'
      - 'dobins-indian-catalog/tests/**'
      - 'dobins-indian-catalog/audit_just_added.mjs'
      - '.github/workflows/just-added-regression-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalogue test dependencies
        run: python -m pip install --disable-pip-version-check -r dobins-indian-catalog/requirements.txt
      - name: Run Python catalogue regression tests
        run: python -m unittest discover -s dobins-indian-catalog/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit script syntax
        run: node --check dobins-indian-catalog/audit_just_added.mjs
      - name: Test read-only audit classification
        run: node --test dobins-indian-catalog/tests/*.test.mjs

  poster-service-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: fix/authoritative-just-added-poster-20261123
          path: service
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install poster service dependencies
        run: npm install --no-package-lock --prefix service/poster-date-service
      - name: Run poster service regression suite
        run: npm test --prefix service/poster-date-service

  read-only-manifest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan both metadata instances and Xperience (GET-only)
        env:
          CATALOG_MANIFEST_MIDNIGHTIGNITE_URL: ${{ secrets.CATALOG_MANIFEST_MIDNIGHTIGNITE_URL }}
          CATALOG_MANIFEST_ELFHOSTED_URL: ${{ secrets.CATALOG_MANIFEST_ELFHOSTED_URL }}
          CATALOG_MANIFEST_XPERIENCE_URL: ${{ secrets.CATALOG_MANIFEST_XPERIENCE_URL }}
        run: node dobins-indian-catalog/audit_just_added.mjs
      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: just-added-read-only-audit
          path: |
            artifacts/just-added-audit.json
            artifacts/just-added-audit.md
          if-no-files-found: warn
