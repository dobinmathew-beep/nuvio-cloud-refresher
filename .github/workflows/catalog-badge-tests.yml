name: Catalog badge regression tests

on:
  pull_request:
    branches: [dobins-catalog]
    paths:
      - 'dobins-indian-catalog/update.py'
      - 'dobins-indian-catalog/tests/**'
      - 'dobins-indian-catalog/requirements.txt'
      - '.github/workflows/catalog-badge-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dobins-indian-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run catalogue regression suite
        run: python -m unittest discover -s tests -v
