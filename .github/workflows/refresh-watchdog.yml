name: Refresh watchdog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [refresh_watchdog.py, update_dashboard.py, tests/test_refresh_watchdog.py, tests/test_update_dashboard.py, tests/test_media_schedule.py, tests/test_featured.py, tests/test_verify_backdrops.py, state/success.json, .github/workflows/refresh-watchdog.yml]
  schedule:
    - cron: '3,33 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-watchdog
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'dobinmathew-beep/nuvio-cloud-refresher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test due-cycle and retry rules
        run: python3 -m unittest discover -s tests -v
      - name: Check published cycles and dispatch overdue refreshes
        id: check
        continue-on-error: true
        run: python3 refresh_watchdog.py
      - name: Save current dashboard and daily audit history
        if: always()
        run: |
          git config user.name 'Refresh watchdog'
          git config user.email 'refresh-watchdog@users.noreply.github.com'
          mkdir -p logs
          git add state/watchdog.json DAILY_UPDATES.md logs
          if ! git diff --cached --quiet; then
            git commit -m 'Record refresh dashboard and daily check history'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Report stale or failed checks visibly
        if: steps.check.outcome == 'failure'
        run: exit 1
