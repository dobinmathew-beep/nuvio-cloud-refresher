name: India EPG daily refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['epg/**', '.github/workflows/india-epg.yml']
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: india-epg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    if: github.repository == 'dobinmathew-beep/nuvio-cloud-refresher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the current verified EPG is due
        id: plan
        run: python3 epg/plan.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - name: Fetch, validate, publish and verify (up to three attempts)
        if: steps.plan.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "EPG refresh attempt $attempt"
            if python -u epg/refresh.py && python epg/validate.py && python -u epg/github_upload.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo 'Refresh failed. The previous valid published guide remains available.'
          exit 1
      - name: Save guide and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-epg-${{ github.run_id }}
          path: epg/output/
          if-no-files-found: ignore
          retention-days: 14

  # Keep the refresh job read-only; only this notifier needs repository dispatch permission.
  notify:
    needs: refresh
    if: always() && (needs.refresh.result == 'failure' || needs.refresh.result == 'cancelled' || needs.refresh.outputs.pending == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notify watchdog and independent verifier after EPG output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dobinmathew-beep/nuvio-cloud-refresher/dispatches \
            --data-raw "{\"event_type\":\"nuvio-output-updated\",\"client_payload\":{\"component\":\"epg\",\"verify_only\":\"epg\",\"run_id\":\"${GITHUB_RUN_ID}\"}}"
