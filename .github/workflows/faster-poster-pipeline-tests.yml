name: Faster poster pipeline tests

on:
  pull_request:
    branches: [poster-date-service]
    paths:
      - 'poster-date-service/**'
      - '.github/workflows/faster-poster-pipeline-tests.yml'
  push:
    branches: [faster-poster-pipeline]
    paths:
      - 'poster-date-service/**'
      - '.github/workflows/faster-poster-pipeline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poster-date-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faster-poster-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
