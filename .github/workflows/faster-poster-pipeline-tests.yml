name: Faster poster pipeline tests

on:
  pull_request:
    branches: [poster-date-service]
    paths:
      - 'poster-date-service/**'
      - '.github/workflows/faster-poster-pipeline-tests.yml'
  push:
    branches: [faster-poster-pipeline, 'fix/**', imagekit-write-churn-production-integration']
    paths:
      - 'poster-date-service/**'
      - '.github/workflows/faster-poster-pipeline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poster-date-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

      - name: Read-only production durable queue recovery gate
        env:
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        run: node scripts/check-live-durable-queue-readonly.mjs

      - name: Read-only live scan of the three configured manifests
        env:
          CATALOG_MANIFEST_ELFHOSTED_URL: ${{ secrets.CATALOG_MANIFEST_ELFHOSTED_URL }}
          CATALOG_MANIFEST_MIDNIGHTIGNITE_URL: ${{ secrets.CATALOG_MANIFEST_MIDNIGHTIGNITE_URL }}
          CATALOG_MANIFEST_XPERIENCE_URL: ${{ secrets.CATALOG_MANIFEST_XPERIENCE_URL }}
        run: node scripts/validate-three-manifest-scan.mjs
