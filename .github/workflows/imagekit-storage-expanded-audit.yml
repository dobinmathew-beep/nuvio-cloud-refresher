name: Expanded read-only ImageKit storage audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/imagekit-storage-expanded-audit.yml"

permissions:
  contents: read

jobs:
  expanded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out expanded audit implementation
        uses: actions/checkout@v4
        with:
          ref: imagekit-expanded-read-only-audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: poster-date-service
        run: npm install --no-audit --no-fund
      - name: Run full regression suite
        working-directory: poster-date-service
        run: npm test
      - name: Run expanded read-only ImageKit inventory and version reconciliation
        if: github.event_name == 'workflow_dispatch'
        working-directory: poster-date-service
        env:
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_AUDIT_REPORT_PATH: ../reports/imagekit-storage-expanded-audit-live.json
          IMAGEKIT_AUDIT_VERSION_CONCURRENCY: "4"
        run: node scripts/imagekit-storage-expanded-audit.mjs
      - name: Upload expanded audit report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: imagekit-storage-expanded-audit
          path: reports/imagekit-storage-expanded-audit-live.json
          if-no-files-found: error
          retention-days: 14
