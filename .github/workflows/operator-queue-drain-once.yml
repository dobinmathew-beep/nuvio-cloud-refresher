name: Operator one-time queue drain

on:
  push:
    branches:
      - operator/queue-drain-20261123
    paths:
      - .github/workflows/operator-queue-drain-once.yml

permissions:
  contents: read

concurrency:
  group: great-indian-poster-pipeline
  cancel-in-progress: false

jobs:
  queue-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Start explicit production queue drain and wait
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then
            echo "::error::POSTER_CATALOG_SCAN_TOKEN repository secret is missing."
            exit 1
          fi

          start_file="$(mktemp)"
          status_file="$(mktemp)"
          trap 'rm -f "$start_file" "$status_file"' EXIT

          code="$(curl --silent --show-error --max-time 60 -o "$start_file" -w '%{http_code}' \
            -X POST "$POSTER_SERVICE_URL/catalog-refresh?mode=queue-drain" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
          cat "$start_file" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$code" = "202" ]; then
            job_id="$(node -e "const x=require('fs').readFileSync(process.argv[1],'utf8');const j=JSON.parse(x);if(j.status!=='accepted'||!j.jobId)process.exit(2);process.stdout.write(j.jobId)" "$start_file")"
            echo "Started production queue-drain job: $job_id" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = "409" ]; then
            echo "A refresh already owns the production lease; monitoring it rather than starting a second worker." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Queue-drain start returned HTTP $code."
            exit 1
          fi

          deadline=$((SECONDS + 21000))
          status="not-started"
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 45 -o "$status_file" -w '%{http_code}' \
              "$POSTER_SERVICE_URL/catalog-refresh/status" \
              -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
            if [ "$code" != "200" ]; then
              echo "Status endpoint returned HTTP $code; retrying in 30 seconds."
              sleep 30
              continue
            fi
            status="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.status||'unknown')" "$status_file")"
            echo "Queue-drain status: $status"
            if [ "$status" = "completed" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "coordination-unavailable" ] || [ "$status" = "paused" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::Queue-drain ended in status $status."
              exit 1
            fi
            sleep 30
          done

          if [ "$status" != "completed" ]; then
            echo "::error::Queue-drain exceeded the 5h50m monitoring window."
            exit 1
          fi

      - name: Capture final queue diagnostics
        if: always()
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then exit 0; fi
          curl --silent --show-error --max-time 45 "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
