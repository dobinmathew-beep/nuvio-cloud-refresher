name: Dobins Indian Catalog
# Trigger full validation for the source-parser, pagination and per-catalog freshness fixes.
# Also validate rolling recent-release ingestion from the dobins-catalog branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [dobins-indian-catalog/**, .github/workflows/dobins-indian-catalog.yml]
  schedule:
    - cron: '0,30 * * * *'
permissions:
  contents: write
concurrency:
  group: dobins-indian-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dobins-catalog
      - name: Restore initial published data when needed
        run: python3 dobins-indian-catalog/bootstrap.py
      - name: Check the Muscat release-update schedule
        id: plan
        run: python3 dobins-indian-catalog/schedule.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - name: Install release parser dependencies
        if: steps.plan.outputs.pending == 'true'
        run: python -m pip install --disable-pip-version-check -r dobins-indian-catalog/requirements.txt
      - name: Test catalog matching and schedule
        if: steps.plan.outputs.pending == 'true'
        run: python -m unittest discover -s dobins-indian-catalog/tests -v
      - name: Update digital releases and IMDb metadata
        if: steps.plan.outputs.pending == 'true'
        id: update
        continue-on-error: true
        run: python -u dobins-indian-catalog/update.py
      - name: Preserve metadata caches, catalogs and source health
        if: always()
        id: persist
        run: |
          set -e
          git config user.name 'Dobins Indian Catalog'
          git config user.email 'dobins-catalog@users.noreply.github.com'
          git add dobins-indian-catalog/data
          if git diff --cached --quiet; then
            echo 'No generated catalog data changes to persist.'
            exit 0
          fi

          git commit -m 'Refresh Dobins Indian Catalog digital releases'

          # Serialize refresh runs and rebase generated data onto any intervening
          # maintenance commits. Retry if the remote branch advances during push.
          for attempt in 1 2 3 4 5; do
            git fetch origin dobins-catalog
            if ! git rebase origin/dobins-catalog; then
              git rebase --abort || true
              echo 'Cannot safely rebase generated catalog data; refusing to overwrite remote changes.'
              exit 1
            fi
            if git push origin HEAD:dobins-catalog; then
              echo "Catalog data persisted successfully (push attempt $attempt)."
              exit 0
            fi
            echo "Branch advanced or push failed on attempt $attempt; retrying after fetch/rebase."
            sleep 2
          done

          echo 'Catalog data could not be persisted after five safe push attempts.'
          exit 1
      # Verify the public service only after the new snapshot has been pushed.
      - name: Check public addon and checkout availability
        if: always() && steps.persist.outcome == 'success'
        id: site_health
        continue-on-error: true
        run: python3 dobins-indian-catalog/check_site.py
      - name: Persist public catalog health diagnostics
        if: always() && steps.persist.outcome == 'success'
        id: health_report
        run: |
          set -e
          git config user.name 'Dobins Indian Catalog'
          git config user.email 'dobins-catalog@users.noreply.github.com'
          git add dobins-indian-catalog/data/catalog-health.json
          if git diff --cached --quiet; then
            echo 'No public health report changes to persist.'
            exit 0
          fi

          git commit -m 'Record public catalog health diagnostics'
          for attempt in 1 2 3 4 5; do
            git fetch origin dobins-catalog
            if ! git rebase origin/dobins-catalog; then
              git rebase --abort || true
              echo 'Cannot safely rebase the public health report; refusing to overwrite remote changes.'
              exit 1
            fi
            if git push origin HEAD:dobins-catalog; then
              echo "Public health report persisted successfully (push attempt $attempt)."
              exit 0
            fi
            echo "Branch advanced or push failed on attempt $attempt; retrying after fetch/rebase."
            sleep 2
          done

          echo 'Public health report could not be persisted after five safe push attempts.'
          exit 1
      - name: Keep failed work pending for the next 30-minute check
        if: steps.update.outcome == 'failure' || steps.persist.outcome == 'failure' || steps.site_health.outcome == 'failure' || steps.health_report.outcome == 'failure'
        run: exit 1

# Regression: validate newest digital-arrival date precedence in physical.py.
