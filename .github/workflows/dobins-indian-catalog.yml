name: Dobins Indian Catalog
on:
  workflow_dispatch:
  push:
    branches: [dobins-catalog]
    paths: [dobins-indian-catalog/**, .github/workflows/dobins-indian-catalog.yml]
  schedule:
    - cron: '0,30 * * * *'
permissions:
  contents: write
concurrency:
  group: dobins-indian-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dobins-catalog
      - name: Restore initial published data when needed
        run: python3 dobins-indian-catalog/bootstrap.py
      - name: Check the Muscat release-update schedule
        id: plan
        run: python3 dobins-indian-catalog/schedule.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - name: Install release parser dependencies
        if: steps.plan.outputs.pending == 'true'
        run: python -m pip install --disable-pip-version-check -r dobins-indian-catalog/requirements.txt
      - name: Test catalog matching and schedule
        if: steps.plan.outputs.pending == 'true'
        run: python -m unittest discover -s dobins-indian-catalog/tests -v
      - name: Update digital releases and IMDb metadata
        if: steps.plan.outputs.pending == 'true'
        id: update
        continue-on-error: true
        run: python -u dobins-indian-catalog/update.py
      - name: Check public addon and checkout availability
        if: always()
        id: site_health
        continue-on-error: true
        run: python3 dobins-indian-catalog/check_site.py
      - name: Preserve metadata caches, catalogs and source health
        if: always()
        run: |
          git config user.name 'Dobins Indian Catalog'
          git config user.email 'dobins-catalog@users.noreply.github.com'
          git add dobins-indian-catalog/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Dobins Indian Catalog digital releases'
            git push origin HEAD:dobins-catalog
          fi
      - name: Keep failed work pending for the next 30-minute check
        if: steps.update.outcome == 'failure' || steps.site_health.outcome == 'failure'
        run: exit 1
