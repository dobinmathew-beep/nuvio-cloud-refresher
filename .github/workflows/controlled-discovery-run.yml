name: Controlled discovery-only metadata baseline
on:
  push:
    branches:
      - controlled-discovery-run
    paths:
      - .github/workflows/controlled-discovery-run.yml
permissions:
  contents: read
concurrency:
  group: controlled-discovery-only-baseline
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Validate service diagnostics before scan
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SCAN_TOKEN" || { echo "::error::POSTER_CATALOG_SCAN_TOKEN is missing"; exit 1; }
          curl --silent --show-error --fail-with-body --max-time 45 \
            "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            | tee "$RUNNER_TEMP/before.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run full three-manifest discovery-only baseline
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          start_file="$RUNNER_TEMP/start.json"
          status_file="$RUNNER_TEMP/status.json"
          code="$(curl --silent --show-error --max-time 60 -o "$start_file" -w '%{http_code}' \
            -X POST "$POSTER_SERVICE_URL/catalog-refresh?mode=discovery-only" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
          cat "$start_file" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = "202" || { echo "::error::Discovery start returned HTTP $code"; exit 1; }
          job_id="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(j.status!=='accepted'||!j.jobId)process.exit(2);process.stdout.write(j.jobId)" "$start_file")"
          echo "Discovery job: $job_id" >> "$GITHUB_STEP_SUMMARY"
          deadline=$((SECONDS + 21000))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 45 -o "$status_file" -w '%{http_code}' \
              "$POSTER_SERVICE_URL/catalog-refresh/status" \
              -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
            if [ "$code" != "200" ]; then sleep 30; continue; fi
            status="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.status||'unknown')" "$status_file")"
            echo "Discovery status: $status"
            if [ "$status" = "completed" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "coordination-unavailable" ] || [ "$status" = "paused" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::Discovery scan ended in $status"
              exit 1
            fi
            sleep 30
          done
          test "$status" = "completed" || { echo "::error::Discovery exceeded monitoring window"; exit 1; }
      - name: Validate final three-manifest checkpoint and queue snapshot
        if: always()
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then exit 0; fi
          curl --silent --show-error --max-time 45 "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            | tee "$RUNNER_TEMP/after.json" | tee -a "$GITHUB_STEP_SUMMARY"

# one-off run trigger
