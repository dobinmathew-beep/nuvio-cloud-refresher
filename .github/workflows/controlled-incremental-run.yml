name: One-off three-manifest incremental metadata validation
on:
  push:
    branches:
      - controlled-incremental-run
    paths:
      - .github/workflows/controlled-incremental-run.yml
permissions:
  contents: read
concurrency:
  group: controlled-incremental-metadata-validation
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Confirm baseline and all three manifest sources
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SCAN_TOKEN"
          curl --silent --show-error --fail-with-body --max-time 60 \
            "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            -o "$RUNNER_TEMP/before.json"
          node - "$RUNNER_TEMP/before.json" <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (d.configuredManifestCount !== 3 || d.manifests?.length !== 3) throw new Error('Expected exactly three configured manifests');
          if (!d.durableQueue || d.durableQueue.status === 'unavailable') throw new Error('Discovery baseline queue is not durable/available');
          console.log(JSON.stringify({manifests:d.manifests,uniqueCatalogueCount:d.uniqueCatalogueCount,titleFileCount:d.titleFileCount,durableQueue:d.durableQueue},null,2));
          NODE
      - name: Run bounded metadata-only incremental scan
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          start_file="$RUNNER_TEMP/start.json"
          status_file="$RUNNER_TEMP/status.json"
          code="$(curl --silent --show-error --max-time 60 -o "$start_file" -w '%{http_code}' \
            -X POST "$POSTER_SERVICE_URL/catalog-refresh?mode=incremental-discovery" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
          cat "$start_file"
          test "$code" = "202" || { echo "::error::Incremental scan start returned HTTP $code"; exit 1; }
          job_id="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(j.status!=='accepted'||!j.jobId)process.exit(2);process.stdout.write(j.jobId)" "$start_file")"
          echo "Incremental job: $job_id" >> "$GITHUB_STEP_SUMMARY"
          deadline=$((SECONDS + 6900))
          status="starting"
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 60 -o "$status_file" -w '%{http_code}' \
              "$POSTER_SERVICE_URL/catalog-refresh/status" \
              -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
            if [ "$code" != "200" ]; then sleep 15; continue; fi
            status="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.status||'unknown')" "$status_file")"
            echo "Incremental status: $status"
            if [ "$status" = "completed" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              node - "$status_file" <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const r = j.report || j.progress?.report;
          if (!r || r.status !== 'incremental-metadata-complete' || r.mode !== 'incremental-discovery') throw new Error('Missing successful incremental metadata report');
          if (r.manifestsScanned !== 3 || !r.metadataManifestPath || !r.deltaPath) throw new Error('Incomplete three-manifest metadata report');
          console.log(JSON.stringify(r,null,2));
          NODE
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "coordination-unavailable" ] || [ "$status" = "paused" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::Incremental scan ended in $status"
              exit 1
            fi
            sleep 15
          done
          test "$status" = "completed" || { echo "::error::Incremental scan exceeded its monitoring window"; exit 1; }
      - name: Verify final checkpoint and published queue state
        if: always()
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SCAN_TOKEN"
          curl --silent --show-error --fail-with-body --max-time 60 \
            "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
