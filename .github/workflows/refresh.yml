name: Nuvio cloud refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refresh.yml, cloud.py, featured.py, hero_prepare.py, hero_render.py, verify_backdrops.py, source-archive.json, legacy-files.json, legacy-html.json]
  schedule:
    - cron: '0 */2 * * *'
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: nuvio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip completed two-hour refresh cycles
        id: plan
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from refresh_watchdog import due, fresh
          p=Path('state/success.json')
          state=json.loads(p.read_text()) if p.exists() else {}
          target=due(datetime.datetime.now(ZoneInfo('Asia/Muscat')),'media')
          done=fresh(state,'media',target)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('pending='+('false' if done else 'true')+'\n')
          print('Current cycle already complete.' if done else 'Refresh work is pending.')
          PY
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        if: steps.plan.outputs.pending == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.26,<3'
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Refresh pending outputs for the current Muscat cycle
        if: steps.plan.outputs.pending == 'true'
        id: refresh
        continue-on-error: true
        run: python -u cloud.py
      - name: Persist verified media pointers and partial progress
        if: always()
        run: |
          mkdir -p state
          git config user.name 'Nuvio refresh'
          git config user.email 'nuvio-refresh@users.noreply.github.com'
          git add state
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Nuvio refresh state'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Mark incomplete refresh for the ten-minute watchdog
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Refresh incomplete. Last-good media retained. The next scheduled check retries pending work.'
          exit 1

