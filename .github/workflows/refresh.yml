name: Nuvio cloud refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'

permissions:
  contents: write

concurrency:
  group: nuvio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip completed two-hour refresh cycles
        id: plan
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from refresh_watchdog import due, fresh
          p=Path('state/success.json')
          state=json.loads(p.read_text()) if p.exists() else {}
          target=due(datetime.datetime.now(ZoneInfo('Asia/Muscat')),'media')
          done=fresh(state,'media',target)
          if done:
              # A source catalog can change order mid-cycle. Do not skip a refresh
              # merely because the two-hour media cycle was previously completed.
              try:
                  from featured import LANGS, SOURCE, get, first_valid
                  live={}
                  for lang,cat in LANGS.items():
                      metas=get(f'{SOURCE}/catalog/movie/{cat}.json').get('metas',[])
                      chosen=first_valid(metas,lang)
                      if not chosen:
                          raise RuntimeError(f'{lang}: no valid current catalog head')
                      live[lang]=str(chosen.get('id','')).split('||',1)[0]
                  saved=state.get('featured_ids',{})
                  if live != saved:
                      print('Catalog head changed within the completed cycle:', {'saved':saved,'live':live})
                      done=False
                  else:
                      print('Current cycle and all four live catalog heads are already verified.')
              except Exception as exc:
                  print('Live catalog-head check failed; scheduling a safe retry:', str(exc))
                  done=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('pending='+('false' if done else 'true')+'\n')
          print('Refresh work is pending.' if not done else 'Current cycle already complete.')
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        if: steps.plan.outputs.pending == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.26,<3'
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Refresh pending outputs for the current Muscat cycle
        if: steps.plan.outputs.pending == 'true'
        id: refresh
        continue-on-error: true
        run: python -u cloud.py
      - name: Persist verified media pointers and partial progress
        if: always()
        run: |
          mkdir -p state
          git config user.name 'Nuvio refresh'
          git config user.email 'nuvio-refresh@users.noreply.github.com'
          git add state
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Nuvio refresh state'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
      - name: Verify exact published reel fingerprints on the public URL
        id: reelcheck
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          origin='https://dobin-nuvio-star-cards.quickfield138.chatgpt.site'
          state=json.loads(Path('state/success.json').read_text())
          media=json.loads(Path('state/media.json').read_text())
          heroes=state.get('heroes',{})
          fingerprints=heroes.get('language_fingerprints',{})
          assert set(fingerprints)=={'hindi','tamil','malayalam','telugu'}, 'Missing four-language render fingerprints'
          def fetch(url,expected):
              last='no response'
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Nuvio-reel-freshness-check/1'})
                      with urllib.request.urlopen(req,timeout=180) as r:
                          data=r.read()
                      actual=hashlib.sha256(data).hexdigest()
                      if actual==expected:
                          return data
                      last=f'public URL has not reached the committed manifest yet (expected {expected}, got {actual})'
                  except Exception as exc:
                      last=str(exc)
                  if attempt<5:
                      delay=5*(attempt+1)
                      print(f'Waiting {delay}s for public manifest propagation: {last}',flush=True)
                      time.sleep(delay)
              raise AssertionError(last)
          for lang,fp in fingerprints.items():
              video_path=f'/hero/{lang}.mp4'
              json_path=f'/hero/{lang}-daily.json'
              for path,expected in ((video_path,fp['video_sha256']),(json_path,fp['metadata_sha256'])):
                  asset=media[path]
                  assert asset['sha256']==expected, f'{path}: state/media.json does not point at this render'
                  public=fetch(origin+path+'?freshness='+expected[:16],expected)
                                metadata=json.loads(fetch(origin+json_path+'?freshness='+fp['metadata_sha256'][:16],fp['metadata_sha256']))
              assert metadata.get('checked_at')==fp['checked_at'], f'{lang}: public metadata timestamp mismatch'
              ids=[str(x['id']) for x in metadata.get('movies',[])]
              assert ids==fp['movie_ids'], f'{lang}: public movie list differs from the render'
              assert len(ids)==20, f'{lang}: expected 20 films, found {len(ids)}'
              print(f'PUBLIC FRESHNESS VERIFIED {lang}: {len(ids)} films, SHA-256 {fp["video_sha256"]}')
          print('All four public reels exactly match the newly rendered MP4 and daily metadata fingerprints.')
          PY
      - name: Invalidate reel progress if public freshness verification failed
        if: steps.reelcheck.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('state/success.json')
          state=json.loads(path.read_text()) if path.exists() else {}
          state.pop('heroes',None)
          path.write_text(json.dumps(state,indent=2) + chr(10))
          last_path=Path('state/last-run.json')
          last=json.loads(last_path.read_text()) if last_path.exists() else {}
          errors=last.get('errors',[])
          message='Public hero freshness verification failed; current media cycle remains unverified.'
          if message not in errors:errors.append(message)
          last['errors']=errors
          last_path.write_text(json.dumps(last,indent=2) + chr(10))
          print('Cleared hero success marker so the next scheduled check retries reel publishing.')
          PY
      - name: Persist invalidated hero state after failed public verification
        if: steps.reelcheck.outcome == 'failure'
        run: |
          git config user.name 'Nuvio refresh'
          git config user.email 'nuvio-refresh@users.noreply.github.com'
          git add state/success.json state/last-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Invalidate unverified hero refresh state'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi

      - name: Mark incomplete refresh for the ten-minute watchdog
        if: steps.refresh.outcome == 'failure' || steps.reelcheck.outcome == 'failure'
        run: |
          echo 'Refresh incomplete. Last-good media retained. The next scheduled check retries pending work.'
          exit 1


      # repository_dispatch resets GitHub's workflow_run chain after catch-up dispatches.
      - name: Notify watchdog and independent verifier after media output
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dobinmathew-beep/nuvio-cloud-refresher/dispatches \
            --data-raw "{\"event_type\":\"nuvio-output-updated\",\"client_payload\":{\"component\":\"media\",\"verify_only\":\"backdrops,reels\",\"run_id\":\"${GITHUB_RUN_ID}\"}}"
