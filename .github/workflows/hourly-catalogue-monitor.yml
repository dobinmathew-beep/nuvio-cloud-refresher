name: Retired legacy catalogue monitor and recovery (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retirement
        run: |
          echo "Legacy five-minute monitor and automatic recovery are retired."
          echo "No health keepalive, status polling, refresh restart, or recovery request is started."
          echo "All scheduled checks have been removed."
