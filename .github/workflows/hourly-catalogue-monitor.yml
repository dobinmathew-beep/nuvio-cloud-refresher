name: Hourly catalogue refresh monitor
# Reads lease-owner progress snapshots shared through Render Redis.
# This report includes unique-title growth and catalogue throughput, not checkpoint totals as new work.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly-catalogue-monitor.yml'
  schedule:
    # GitHub Actions schedules use UTC. Run hourly at minute 17 to avoid
    # colliding with the existing 06:00/18:00 Oman refresh schedule.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: hourly-catalogue-refresh-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Render health and catalogue refresh
        id: monitor
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then
            echo "::error::POSTER_CATALOG_SCAN_TOKEN repository secret is missing."
            exit 1
          fi

          health_code=$(curl --silent --show-error --max-time 30 -o health.json -w '%{http_code}' "$POSTER_SERVICE_URL/health") || {
            echo "::error::Render health endpoint could not be reached."
            exit 1
          }
          status_code=$(curl --silent --show-error --max-time 30 -o status.json -w '%{http_code}' "$POSTER_SERVICE_URL/catalog-refresh/status" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json") || {
            echo "::error::Authenticated catalogue status endpoint could not be reached."
            exit 1
          }

          echo "Health HTTP: $health_code"
          cat health.json
          echo
          echo "Refresh status HTTP: $status_code"
          cat status.json
          echo

          if [ "$status_code" != "200" ]; then
            echo "::error::Catalogue status endpoint returned HTTP $status_code."
            exit 1
          fi

          state=$(node -e "const s=require('./status.json'); console.log(s.status || 'unknown')")
          echo "state=$state" >> "$GITHUB_OUTPUT"

          recovery="not-needed"
          if [ "$state" = "failed" ]; then
            echo "::warning::Refresh is failed; attempting one safe checkpoint-preserving resume."
            retry_code=$(curl --silent --show-error --max-time 90 -X POST \
              -o retry.json -w '%{http_code}' "$POSTER_SERVICE_URL/catalog-refresh" \
              -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json") || {
                echo "::error::Automatic recovery request could not reach Render."
                exit 1
              }
            cat retry.json
            echo
            if [ "$retry_code" = "202" ] || [ "$retry_code" = "409" ]; then
              recovery="resume-accepted-or-existing-run"
              echo "::notice::Checkpoint-preserving resume accepted or another worker already owns the run."
            elif [ "$retry_code" = "423" ]; then
              recovery="paused-by-operator"
              echo "::warning::Service is paused by operator; no override attempted."
            else
              recovery="retry-rejected-http-$retry_code"
              echo "::error::Automatic recovery was rejected with HTTP $retry_code."
              exit 1
            fi
          elif [ "$state" = "coordination-unavailable" ]; then
            echo "::error::Refresh coordination is unavailable; no competing refresh was started."
            exit 1
          elif [ "$state" = "running" ]; then
            echo "::notice::Refresh is active; monitor did not start a competing job."
          elif [ "$state" = "completed" ]; then
            echo "::notice::Latest refresh reports completed."
          elif [ "$state" = "idle" ]; then
            echo "::notice::No refresh is active. Monitor leaves idle state untouched."
          else
            echo "::warning::Unrecognized refresh state: $state"
          fi

          {
            echo "## Hourly catalogue refresh monitor"
            echo "- Checked at (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- Render health HTTP: $health_code"
            echo "- Catalogue status HTTP: $status_code"
            echo "- Refresh state: **$state**"
            echo "- Automatic recovery: **$recovery**"
            echo
            echo "### Health response"
            echo '--- JSON ---'
            cat health.json
            echo
            echo "### Refresh response"
            echo '--- JSON ---'
            cat status.json
            echo
          } >> "$GITHUB_STEP_SUMMARY"


          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('status.json', 'utf8'));
          const p = s.progress || {};
          const n = v => Number.isFinite(Number(v)) ? Number(v).toLocaleString() : '—';
          const elapsed = n(p.elapsedSeconds);
          const correctedRates = p.titlesNewThisRun !== undefined && p.cataloguesPerMinute !== undefined;
          console.log('### Live refresh progress');
          console.log('| Metric | Current value |');
          console.log('|---|---:|');
          console.log('| Stage | ' + (p.stage || '—') + ' |');
          console.log('| Progress source | ' + (s.progressState || (s.progress ? 'local' : 'not-available')) + ' |');
          console.log('| Completion | ' + n(p.completionPercent) + '% |');
          console.log('| Catalogues scanned / discovered | ' + n(p.cataloguesScanned) + ' / ' + n(p.cataloguesDiscovered) + ' (of ' + n(p.cataloguesTotal) + ') |');
          console.log('| Catalogues failed / skipped | ' + n(p.cataloguesFailed) + ' / ' + n(p.cataloguesSkipped) + ' |');
          console.log('| Catalogues resumed from checkpoint | ' + n(p.cataloguesResumed) + ' |');
          console.log('| Catalogue records scanned / resumed | ' + n(p.catalogueRecordsScanned) + ' / ' + n(p.catalogueRecordsResumed) + ' |');
          console.log('| Unique titles discovered | ' + n(p.titlesDiscovered) + ' |');
          console.log('| New unique titles found this run | ' + n(p.titlesNewThisRun) + ' |');
          console.log('| Poster targets / visited | ' + n(p.postersTargeted) + ' / ' + n(p.postersVisited) + ' |');
          console.log('| Posters corrected and verified | ' + n(p.postersCorrected) + ' |');
          console.log('| Existing verified cache hits | ' + n(p.postersCacheHits) + ' |');
          console.log('| Uploads awaiting verification | ' + n(p.postersPending) + ' |');
          console.log('| Failures | ' + n(p.failures) + ' |');
          console.log('| Scan speed | ' + (correctedRates ? n(p.titlesPerMinute) + ' new unique titles/min' : 'awaiting updated lease owner; old rate suppressed') + ' |');
          console.log('| Catalogue scan speed | ' + (correctedRates ? n(p.cataloguesPerMinute) + ' catalogues/min' : 'awaiting updated lease owner') + ' |');
          console.log('| Poster processing speed | ' + n(p.postersPerMinute) + ' posters/min |');
          console.log('| Elapsed seconds | ' + elapsed + ' |');
          console.log('| Last durable checkpoint | ' + (p.lastCheckpointAt || '—') + ' |');
          if (Array.isArray(p.failureDetails) && p.failureDetails.length) {
            console.log('');
            console.log('#### Recent failures');
            for (const f of p.failureDetails.slice(-10)) console.log('- ' + [f.stage, f.source, f.catalogue, f.error].filter(Boolean).join(' — '));
          }
          NODE

          if [ "$health_code" -lt 200 ] || [ "$health_code" -ge 300 ]; then
            echo "::error::Render health check failed with HTTP $health_code."
            exit 1
          fi
