name: Legacy catalogue diagnostics (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-catalogue-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Render health and checkpoint status
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then
            echo "::error::POSTER_CATALOG_SCAN_TOKEN repository secret is missing."
            exit 1
          fi
          for endpoint in health catalog-refresh/status catalog-refresh/diagnostics; do
            if [ "$endpoint" = "health" ]; then
              url="$POSTER_SERVICE_URL/health"
            else
              url="$POSTER_SERVICE_URL/$endpoint"
            fi
            echo "### $endpoint" >> "$GITHUB_STEP_SUMMARY"
            if [ "$endpoint" = "health" ]; then
              curl --silent --show-error --fail-with-body --max-time 30 "$url" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              curl --silent --show-error --fail-with-body --max-time 30 "$url" \
                -H "Authorization: Bearer $SCAN_TOKEN" \
                -H "Accept: application/json" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done
