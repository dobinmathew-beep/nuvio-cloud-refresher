name: ImageKit storage audit regression tests

on:
  push:
    branches:
      - imagekit-storage-audit-dedup
    paths:
      - "poster-date-service/**"
      - ".github/workflows/imagekit-storage-audit-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poster-date-service/package-lock.json
      - name: Install dependencies
        working-directory: poster-date-service
        run: npm ci --no-audit --no-fund
      - name: Run complete poster-service regression suite
        working-directory: poster-date-service
        run: npm test
