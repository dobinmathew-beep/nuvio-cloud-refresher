name: Great Indian poster pipeline
on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline stage to run
        required: true
        type: choice
        default: discovery-only
        options:
          - discovery-only
          - queue-drain

permissions:
  contents: read

concurrency:
  group: great-indian-poster-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Select pipeline stage
        id: stage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 1 * * *" ]; then
            mode="discovery-only"
          else
            mode="queue-drain"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Pipeline stage: $mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Start pipeline stage and wait for completion
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
          PIPELINE_MODE: ${{ steps.stage.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then
            echo "::error::POSTER_CATALOG_SCAN_TOKEN repository secret is missing."
            exit 1
          fi

          start_file="$(mktemp)"
          status_file="$(mktemp)"
          trap 'rm -f "$start_file" "$status_file"' EXIT

          code="$(curl --silent --show-error --max-time 60 -o "$start_file" -w '%{http_code}' \
            -X POST "$POSTER_SERVICE_URL/catalog-refresh?mode=$PIPELINE_MODE" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
          cat "$start_file" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "202" ]; then
            echo "::error::Pipeline start returned HTTP $code."
            exit 1
          fi

          job_id="$(node -e "const x=require('fs').readFileSync(process.argv[1],'utf8');const j=JSON.parse(x);if(j.status!=='accepted'||!j.jobId)process.exit(2);process.stdout.write(j.jobId)" "$start_file")"
          echo "Accepted job: $job_id" >> "$GITHUB_STEP_SUMMARY"

          deadline=$((SECONDS + 21000))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 45 -o "$status_file" -w '%{http_code}' \
              "$POSTER_SERVICE_URL/catalog-refresh/status" \
              -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json")"
            if [ "$code" != "200" ]; then
              echo "Status endpoint returned HTTP $code; retrying in 30 seconds."
              sleep 30
              continue
            fi
            status="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.status||'unknown')" "$status_file")"
            echo "Pipeline status: $status"
            if [ "$status" = "completed" ]; then
              cat "$status_file" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "coordination-unavailable" ] || [ "$status" = "paused" ]; then
              cat "$status_file" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::Pipeline stage ended in status $status."
              exit 1
            fi
            sleep 30
          done

          if [ "$status" != "completed" ]; then
            echo "::error::Pipeline stage exceeded the 5h50m monitoring window."
            exit 1
          fi

      - name: Capture final queue and catalogue diagnostics
        if: always()
        shell: bash
        env:
          POSTER_SERVICE_URL: https://great-indian-upcoming-posters.onrender.com
          SCAN_TOKEN: ${{ secrets.POSTER_CATALOG_SCAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_TOKEN" ]; then exit 0; fi
          curl --silent --show-error --max-time 45 "$POSTER_SERVICE_URL/catalog-refresh/diagnostics" \
            -H "Authorization: Bearer $SCAN_TOKEN" -H "Accept: application/json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
